name: juna-report

on:
  schedule:
    # 22:50 UTC = 07:50 KST next day, every day. Scheduled runs are often delayed, so start a little early.
    - cron: '50 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Send weekend picks
        run: |
          chmod +x gradlew
          ./gradlew bootRun --no-daemon
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          HOME_LATITUDE: ${{ vars.HOME_LATITUDE || '37.456' }}
          HOME_LONGITUDE: ${{ vars.HOME_LONGITUDE || '127.167' }}

      - name: Commit recommendation history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || git commit -m "chore: update recommendation history"
          git push
